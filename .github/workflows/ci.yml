name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting and comment density (ARCHITECTURE.md conventions)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          make check-style

      - name: Build
        run: make

      - name: Run test suite (tests/test_*.aer — assert()-based, exits nonzero on any failure)
        run: make test

      - name: Run embedding smoke test
        run: make test-embed

      # Fixed seed for reproducibility — see tests/fuzz.py's docstring on why
      # an unseeded run occasionally reports a non-actionable "hang" from a
      # seed fixture's own recursive logic, not an AER defect. timeout-minutes
      # so a genuinely stuck run fails the job fast instead of eating GitHub's
      # 6-hour default (a fuzz-runner hang has happened before).
      - name: Fuzz (ASAN build, fixed seed)
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          echo "## Fuzz results (ASAN, seed 100)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          make fuzz 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The primary development platform is Windows/MSYS2 — this job catches Windows-only breakage
  # (SEH/longjmp interplay, terminal.c's Win32 console paths, MinGW libc differences) that the
  # Ubuntu job structurally cannot see.
  build-and-test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc

      - name: Run test suite
        run: make test

      - name: Run embedding smoke test
        run: make test-embed

      - name: Run register-VM smoke test
        run: make test-smoke
