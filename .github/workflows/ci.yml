name: CI

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting and comment density (ARCHITECTURE.md conventions)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          make check-style

      - name: Build
        run: make

      - name: Run test suite (tests/test_*.aer — assert()-based, exits nonzero on any failure)
        run: make test

      - name: Run embedding smoke test
        run: make test-embed

      - name: Run register-VM smoke test
        run: make test-smoke

      - name: Run opcode encoding round-trip test
        run: make test-roundtrip

      - name: Check every opcode is emitted by some test or benchmark
        run: make check-opcode-coverage

      - name: Check the formatter is idempotent on its own expected output
        run: make test-fmt

      # Catches what ASAN structurally cannot -- misaligned loads especially, since raw struct
      # fields are read out of a byte buffer at computed offsets.
      - name: Run the test suite under UBSan
        run: make test-ubsan

      # A fixed seed plus the interpreter's own instruction budget makes this reproduce exactly:
      # the same seed yields the same findings on any machine, so a failure here is reproducible
      # locally rather than a runner-load artifact. timeout-minutes is belt-and-braces against a
      # stuck runner eating GitHub's 6-hour default.
      - name: Fuzz (ASAN build, fixed seed)
        timeout-minutes: 20
        shell: bash
        run: |
          set -o pipefail
          echo "## Fuzz results (ASAN, seed 100)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          make fuzz 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # The primary development platform is Windows/MSYS2 — this job catches Windows-only breakage
  # (SEH/longjmp interplay, terminal.c's Win32 console paths, MinGW libc differences) that the
  # Ubuntu job structurally cannot see.
  build-and-test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc

      - name: Run test suite
        run: make test

      - name: Run embedding smoke test
        run: make test-embed

      - name: Run register-VM smoke test
        run: make test-smoke

  # ARM is the platform the performance work is actually validated on, and it has had regressions
  # x86 could not see: the byte-aligned instruction encoding was a measured slowdown only here, and
  # the packed-array change regressed 10-13% only here. Both were found by hand on a Raspberry Pi.
  # This job deliberately does not measure performance -- a shared runner is far too noisy, which is
  # what tools/bench.py and a real Pi are for -- but it does catch ARM-only breakage, which is the
  # half that belongs in CI.
  build-and-test-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Run test suite
        run: make test

      - name: Run embedding smoke test
        run: make test-embed

      - name: Run register-VM smoke test
        run: make test-smoke

      - name: Run opcode encoding round-trip test
        run: make test-roundtrip
